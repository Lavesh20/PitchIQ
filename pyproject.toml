[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pitchiq"
version = "0.1.0"
description = "Champions League match prediction engine"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "scikit-learn>=1.5",
    "pyarrow>=16.0",
    "matplotlib>=3.9",
    "xgboost>=2.1",
]

[tool.setuptools.packages.find]
include = ["pitchiq*"]
